# The Actions run-history page — a column of green checkmarks, one per trading
name: daily-pipeline

on:
  schedule:
    # 12:17 UTC = 19:17 WIB, weekdays. IDX closes 16:00 WIB, so data has settled.
    - cron: "17 12 * * 1-5"
    # Backup at 21:17 WIB in case GitHub drops the first one. Safe to run twice:
    # the digest is sent once per day and run_log keeps one row per trigger.
    - cron: "17 14 * * 1-5"
  workflow_dispatch:
   
    inputs:
      date:
        description: "Override date (YYYY-MM-DD), blank = last trading day"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false   

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python src/main.py --date "${{ inputs.date }}"
          else
            python src/main.py
          fi

      - name: Upload dashboard artifact

        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
