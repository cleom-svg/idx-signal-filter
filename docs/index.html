<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDX Signal Filter — pipeline status</title>
<style>
  :root {
    --paper: #f3f5f7;
    --card: #ffffff;
    --ink: #16222e;
    --mid: #63727f;
    --line: #dbe2e8;
    --signal: #0f6b58;
    --noise: #aebbc6;
    --alert: #a8412a;
    --idle: #8fa0ad;
    color-scheme: light;
  }

  /* Dark palette: follows the system setting unless the viewer picked a theme. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f1418;
      --card: #172028;
      --ink: #e4ebf0;
      --mid: #93a3b0;
      --line: #2a3640;
      --signal: #3fb89a;
      --noise: #4b5b68;
      --alert: #e2826a;
      --idle: #6b7c89;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f1418;
    --card: #172028;
    --ink: #e4ebf0;
    --mid: #93a3b0;
    --line: #2a3640;
    --signal: #3fb89a;
    --noise: #4b5b68;
    --alert: #e2826a;
    --idle: #6b7c89;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1.5rem 4rem;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
  }

  main { max-width: 46rem; margin: 0 auto; }

  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .sub { color: var(--mid); font-size: 0.85rem; margin: 0.15rem 0 0; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--line);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); }
  .status[data-state="failed"] .dot { background: var(--alert); }
  .status[data-state="failed"] { color: var(--alert); }
  .status[data-state="no_trading_day"] .dot { background: var(--idle); }
  .status[data-state="no_trading_day"] { color: var(--mid); }

  section { margin-top: 2.5rem; }
  h2 { font-size: 0.9rem; font-weight: 600; margin: 0 0 1rem; }

  /* --- attenuation: the filter itself, which is the whole product --- */
  .stage { display: grid; grid-template-columns: 8.5rem 1fr 4.5rem; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
