<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDX Signal Filter — pipeline status</title>
<style>
  :root {
    --paper: #f3f5f7;
    --card: #ffffff;
    --ink: #16222e;
    --mid: #63727f;
    --line: #dbe2e8;
    --signal: #0f6b58;
    --noise: #aebbc6;
    --alert: #a8412a;
    --idle: #8fa0ad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1.5rem 4rem;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
  }

  main { max-width: 46rem; margin: 0 auto; }

  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .sub { color: var(--mid); font-size: 0.85rem; margin: 0.15rem 0 0; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--line);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); }
  .status[data-state="failed"] .dot { background: var(--alert); }
  .status[data-state="failed"] { color: var(--alert); }
  .status[data-state="no_trading_day"] .dot { background: var(--idle); }
  .status[data-state="no_trading_day"] { color: var(--mid); }

  section { margin-top: 2.5rem; }
  h2 { font-size: 0.9rem; font-weight: 600; margin: 0 0 1rem; }

  /* --- attenuation: the filter itself, which is the whole product --- */
  .stage { display: grid; grid-template-columns: 8.5rem 1fr 4.5rem; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
  .stage-name { font-size: 0.85rem; color: var(--mid); }
  .track { height: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .bar { height: 100%; background: var(--noise); }
  .stage:last-of-type .bar { background: var(--signal); }
  .count { text-align: right; font-size: 0.9rem; font-weight: 500; }

  .scale-note { font-size: 0.75rem; color: var(--mid); margin-top: 0.85rem; }

  .headline-figure { font-size: 2.6rem; font-weight: 300; letter-spacing: -0.03em; line-height: 1; }
  .headline-figure span { font-size: 1rem; font-weight: 400; color: var(--mid); margin-left: 0.4rem; letter-spacing: 0; }

  /* --- digest --- */
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: 0.85rem 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 4.5rem 1fr; gap: 0.9rem; }
  .sym { font-weight: 600; font-size: 0.9rem; }
  .reason { font-size: 0.78rem; color: var(--signal); margin-top: 0.15rem; }
  li a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  li a:hover, li a:focus-visible { border-bottom-color: var(--ink); }

  /* --- run history --- */
  .runs { display: flex; gap: 4px; flex-wrap: wrap; }
  .run { width: 30px; height: 30px; border-radius: 3px; background: var(--signal); position: relative; }
  .run[data-state="failed"] { background: var(--alert); }
  .run[data-state="no_trading_day"] { background: var(--line); }

  .empty { color: var(--mid); font-size: 0.9rem; }

  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .bar { transition: width 420ms cubic-bezier(.22,.61,.36,1); }
  }
  @media (max-width: 34rem) {
    .stage { grid-template-columns: 6.5rem 1fr 3.5rem; }
    header { flex-direction: column; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>IDX Signal Filter</h1>
      <p class="sub" id="run-date">Loading…</p>
    </div>
    <div class="status" id="status" data-state="success">
      <span class="dot"></span><span id="status-text">—</span>
    </div>
  </header>

  <section>
    <h2>What got through today</h2>
    <p class="headline-figure" id="compression">—<span>filtered out</span></p>
    <div id="stages" style="margin-top:1.5rem"></div>
    <p class="scale-note">Bar width is log-scaled so the later stages stay visible. Counts are exact.</p>
  </section>

  <section>
    <h2>Digest</h2>
    <ol id="items"></ol>
  </section>

  <section>
    <h2>Recent runs</h2>
    <div class="runs" id="runs"></div>
    <p class="scale-note">One square per scheduled run. Grey means the market was closed.</p>
  </section>
</main>

<script>
const STAGE_LABELS = {
  raw: "Raw intake",
  deduped: "Deduplicated",
  surprising: "Above threshold",
  watchlist: "On watchlist",
  sent: "Sent"
};

function renderStages(stages) {
  const entries = Object.entries(STAGE_LABELS).filter(([k]) => stages[k] != null);
  const max = Math.max(...entries.map(([k]) => stages[k]), 1);
  document.getElementById("stages").innerHTML = entries.map(([key, label]) => {
    const n = stages[key];
    const pct = Math.max(Math.log(n + 1) / Math.log(max + 1) * 100, 2);
    return `<div class="stage">
      <div class="stage-name">${label}</div>
      <div class="track"><div class="bar" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="count">${n.toLocaleString()}</div>
    </div>`;
  }).join("");
}

function renderItems(items) {
  const list = document.getElementById("items");
  if (!items.length) {
    list.innerHTML = `<li class="empty" style="grid-template-columns:1fr">Nothing crossed threshold today.</li>`;
    return;
  }
  list.innerHTML = items.map(it => `<li>
    <div><span class="sym">${it.symbol ?? "—"}</span></div>
    <div>
      ${it.url ? `<a href="${it.url}">${it.headline ?? ""}</a>` : (it.headline ?? "")}
      <div class="reason">${it.reason ?? ""}</div>
    </div>
  </li>`).join("");
}

function renderRuns(runs) {
  document.getElementById("runs").innerHTML = runs.slice(0, 30).reverse().map(r =>
    `<div class="run" data-state="${r.status}" title="${r.run_date} — ${r.status}, ${r.count_sent ?? 0} sent"></div>`
  ).join("");
}

async function load() {
  try {
    const data = await (await fetch("data/latest.json")).json();
    document.getElementById("run-date").textContent = data.run_date;

    const status = document.getElementById("status");
    status.dataset.state = data.status;
    document.getElementById("status-text").textContent =
      { success: "Ran today", failed: "Run failed", no_trading_day: "Market closed" }[data.status] ?? data.status;

    const s = data.stages ?? {};
    if (s.raw) {
      document.getElementById("compression").innerHTML =
        `${((1 - (s.sent ?? 0) / s.raw) * 100).toFixed(1)}%<span>filtered out</span>`;
    }
    renderStages(s);
    renderItems(data.items ?? []);

    // Run history is optional — the dashboard degrades rather than breaking.
    try {
      const runs = await (await fetch("data/runs.json")).json();
      renderRuns(runs.runs ?? []);
    } catch {
      document.getElementById("runs").innerHTML =
        `<p class="empty">No run history yet.</p>`;
    }
  } catch (err) {
    document.getElementById("run-date").textContent =
      "Could not load data/latest.json — has the pipeline run yet?";
  }
}
load();
</script>
</body>
</html>
